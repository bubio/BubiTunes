name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-linux:
    name: Ubuntu 22.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Swift 公式ツールチェーンの動作に必要なパッケージと、
      # CZlib (systemLibrary) が pkg-config で参照する zlib の開発パッケージ。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils git gnupg2 libc6-dev libcurl4-openssl-dev libedit2 \
            libgcc-11-dev libpython3.10 libsqlite3-0 libstdc++-11-dev \
            libxml2-dev libz3-dev pkg-config tzdata unzip zlib1g-dev

      # ローカル検証で使った Swift 6.4.3 の公式 tarball (ubuntu22.04 ビルド) を導入する。
      - name: Install Swift 6.4.3
        run: |
          curl -fsSL -O https://download.swift.org/swift-6.4.3-release/ubuntu2204/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE-ubuntu22.04.tar.gz
          sudo mkdir -p /opt/swift
          sudo tar -xzf swift-6.4.3-RELEASE-ubuntu22.04.tar.gz -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # macOS 向け公式ツールチェーンは .pkg 形式のため、バージョン固定には
      # swift-actions/setup-swift を使う。バージョンは Linux 側と合わせて 6.4.3。
      - name: Install Swift 6.4.3
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.4.3"

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
