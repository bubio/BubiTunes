name: macOS CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: &build-paths
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/BubiTunesCLI/**'
      - 'Sources/BubiTunesPlayer/**'
      - '!Sources/BubiTunesPlayer/DevicePlayback.swift'
      - '!Sources/BubiTunesPlayer/TerminalWindows.swift'
      - 'Sources/CMinAudio/**'
      - 'Sources/CZlib/**'
      - 'Tests/**'
      - 'BubiTunesRhythm/**'
      - 'LICENSE'
      - 'FMGEN-NOTICE.txt'
      - 'scripts/build-macos.sh'
      - '.github/workflows/macos.yml'
  pull_request:
    paths: *build-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install Swift 6.4.3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swift.pkg" https://download.swift.org/swift-6.4.3-release/xcode/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE-osx.pkg
          sudo installer -pkg "$RUNNER_TEMP/swift.pkg" -target /
          echo "/Library/Developer/Toolchains/swift-6.4.3-RELEASE.xctoolchain/usr/bin" >> "$GITHUB_PATH"
      - name: Build, test and package
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: BubiTunes-macos-arm64
          path: dist/BubiTunes-macos-arm64.tar.gz
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: BubiTunes-macos-arm64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes BubiTunes-macos-arm64.tar.gz
