name: macOS CLI

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
      - name: Package
        run: |
          swift build -c release --arch arm64 --product bubitunes
          mkdir -p dist
          cp "$(swift build -c release --arch arm64 --show-bin-path)/bubitunes" dist/
          cp -R BubiTunesRhythm README.md LICENSE FMGEN-NOTICE.txt dist/
          codesign --force --sign - dist/bubitunes
          codesign --verify --strict dist/bubitunes
          dist/bubitunes --help
          tar -czf BubiTunes-macos-arm64.tar.gz -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: BubiTunes-macos-arm64
          path: BubiTunes-macos-arm64.tar.gz
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: BubiTunes-macos-arm64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes BubiTunes-macos-arm64.tar.gz
