name: Windows CI

on:
  push:
    branches: [main]
    paths: &build-paths
      - 'Package.swift'
      - 'Sources/BubiTunesCLI/**'
      - 'Sources/BubiTunesPlayer/**'
      - '!Sources/BubiTunesPlayer/MacPlayback.swift'
      - '!Sources/BubiTunesPlayer/Terminal.swift'
      - 'Sources/CMinAudio/**'
      - 'Sources/CZlibVendored/**'
      - 'Tests/**'
      - 'LICENSE'
      - 'FMGEN-NOTICE.txt'
      - 'scripts/build-windows.ps1'
      - '.github/workflows/windows.yml'
  pull_request:
    paths: *build-paths
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Install Swift 6.4.3
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: '6.4.3'
      - name: Build, test and package
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
      - name: Prepare the Windows artifact
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath dist/bubitunes-windows-x64.zip -DestinationPath "$env:RUNNER_TEMP/bubitunes-artifact"
      - uses: actions/upload-artifact@v7
        with:
          name: bubitunes-windows-x64
          path: ${{ runner.temp }}/bubitunes-artifact
          include-hidden-files: true
          if-no-files-found: error

  standalone:
    name: Launch the single EXE without Swift
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bubitunes-windows-x64
          path: ${{ runner.temp }}/bubitunes-standalone
      - name: Verify artifact contents and launch
        shell: pwsh
        working-directory: ${{ runner.temp }}/bubitunes-standalone
        run: |
          if (Get-Command swift.exe, swiftc.exe -ErrorAction SilentlyContinue) {
            throw 'Swift was found on the launch runner.'
          }
          $entries = @(Get-ChildItem -Force)
          if ($entries.Count -ne 1 -or $entries[0].Name -cne 'bubitunes.exe' -or $entries[0].PSIsContainer) {
            throw 'Expected bubitunes.exe as the only file in the artifact.'
          }
          $help = & ./bubitunes.exe --help
          if ($LASTEXITCODE -ne 0 -or $help -notlike 'Usage: bubitunes *') {
            throw "The standalone EXE failed to start (exit $LASTEXITCODE)."
          }
          Write-Host $help
